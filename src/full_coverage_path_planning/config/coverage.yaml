# Added on top of robot_navigation/param/hoverboard.yaml by coverage.launch.py.
# (Merged at launch time, so hoverboard.yaml stays the single Nav2 baseline.)
planner_server:
  ros__parameters:
    planner_plugins: ["GridBased", "SpiralSTC"]
    SpiralSTC:
      plugin: "full_coverage_path_planner/SpiralSTC"
      # Spiral-STC plans on a coarse grid of cells 2*robot_radius wide, each
      # split into four tool-sized sub-cells. Hoverboard chassis: 0.33 m square.
      robot_radius: 0.17
      # The "tool" is the robot itself (no brush/sweeper): half its width.
      # Lower it for more overlap between passes.
      tool_radius: 0.165

controller_server:
  ros__parameters:
    controller_plugins: ["FollowPath", "FollowCoverage"]
    # Regulated Pure Pursuit tracks the coverage lanes closely; MPPI
    # (FollowPath) is free to cut corners, which leaves gaps in coverage.
    # Stands in for the original's tracking_pid (ROS 1 only).
    FollowCoverage:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2              # the original ran at 0.2 m/s too
      lookahead_dist: 0.35
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.6
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.08
      use_rotate_to_heading: true           # turn on the spot at lane ends
      rotate_to_heading_angular_vel: 0.8
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.5
      allow_reversing: false
      max_robot_pose_search_dist: 2.0

# Spiral-STC treats every cell costing more than 65 as blocked, and gives up
# if the robot's own start tile is blocked. With the navigation inflation
# (0.35 m, gentle falloff) that blocks a wide band along every wall: in a
# 2.5 x 2 m test room the robot 0.4 m from a wall got an empty plan. Coverage
# wants to go close to walls anyway, so it gets a tight, steep inflation.
global_costmap:
  global_costmap:
    ros__parameters:
      inflation_layer:
        inflation_radius: 0.25
        cost_scaling_factor: 10.0
